<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0b0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="方塊井" />
    <meta name="format-detection" content="telephone=no" />
    <title>方塊井</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="hud">
        <div class="stat">
          <span class="stat-label">分數</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">等級</span>
          <span class="stat-value" id="level">1</span>
        </div>
        <div class="next-wrap">
          <span class="stat-label">下一個</span>
          <canvas id="next" width="96" height="96" aria-hidden="true"></canvas>
        </div>
        <button type="button" class="icon-btn" id="pause" aria-label="暫停" hidden>暫停</button>
      </header>

      <main class="stage">
        <div class="well-frame" id="well-frame">
          <canvas id="well" width="300" height="600" aria-label="遊戲盤面"></canvas>
        </div>
        <div class="overlay" id="overlay">
          <p class="overlay-kicker" id="overlay-kicker">方塊井</p>
          <h1 class="overlay-title" id="overlay-title">準備落井</h1>
          <p class="overlay-body" id="overlay-body">消行升級。撳下面開始。</p>
          <p class="install-hint" id="install-hint" hidden>
            iPhone：用 Safari 撳分享，再選「加至主畫面」，之後就可以當 App 開。
          </p>
          <button type="button" class="primary-btn" id="overlay-action">開始</button>
        </div>
      </main>

      <footer class="pad">
        <div class="pad-row">
          <button type="button" class="pad-btn" data-action="rotate" aria-label="旋轉">轉</button>
          <button type="button" class="pad-btn pad-btn-accent" data-action="hard" aria-label="硬降">掉</button>
        </div>
        <div class="pad-row">
          <button type="button" class="pad-btn" data-action="left" aria-label="左移">左</button>
          <button type="button" class="pad-btn" data-action="down" aria-label="軟降">落</button>
          <button type="button" class="pad-btn" data-action="right" aria-label="右移">右</button>
        </div>
      </footer>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
